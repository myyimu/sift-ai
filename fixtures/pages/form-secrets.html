<!DOCTYPE html>
<!-- 表单页：form/input/select/textarea/label 整树移除（含预填 value 属性中的秘密），正文保留。 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>账户中心</title>
</head>
<body>
  <main>
    <h1>账户中心</h1>
    <p>本页演示表单场景的安全边界：所有表单控件连同其预填值必须整树丢弃，快照里不允许残留任何用户输入或默认凭证。</p>
    <form action="/api/login" method="post">
      <label for="user">用户名</label>
      <input id="user" name="username" value="alice@example.com">
      <input id="key" name="api_key" type="password" value="sk-FORMSECRETVALUE0000000000">
      <select name="region"><option value="cn">中国</option><option value="us">美国</option></select>
      <textarea name="note">备注里有 ghp_FORMTEXTSECRET00000000000</textarea>
      <button type="submit">提交</button>
    </form>
    <p>表单之外的正文说明：提交之后系统会生成一份审计记录，审计记录只包含时间与操作类型，不包含表单内容本身。</p>
    <p>用户密钥 AKIAIOSFODNN7EXAMPLE 出现在普通段落文本中时，同样必须被替换为脱敏占位符。</p>
  </main>
</body>
</html>
