# electron-builder 配置（ADR-001 E-03 spike：--dir 产出 win-unpacked/Sift.exe）。
# 正式分发（nsis/自动升级）不属于 Demo（P0_DEMO_SCOPE §2.1）。
appId: com.dj.sift.demo
productName: Sift
directories:
  # 输出目录（ADR-002）：曾遇 IDE 文件监视器/Defender 锁住旧 pack/ 产物导致
  # EnsureEmptyDir 失败，标准定为 pack2（.gitignore/.vscode/eslint 均已按 pack* 排除）。
  output: pack2
  # buildResources：SiftHost.cmd 等 manifest/包装器源文件所在（tracked）
  buildResources: build
files:
  - dist/**
  - package.json
asar: true
extraResources:
  # host 真实入口放 asar 外：SiftHost.cmd 以 ELECTRON_RUN_AS_NODE=1 的纯 Node
  # 形态加载它（asar 内文件在纯 Node 下不可直接加载，见 main.ts/ADR-002）。
  - from: dist/host-main.js
    to: host-main.js
extraFiles:
  # Native Messaging 注册入口（ADR-002）：Chrome manifest 的 path 指向这里。
  # 纯 ASCII + 全引号约束见文件头注释。
  - from: build/SiftHost.cmd
    to: SiftHost.cmd

# better-sqlite3 等原生模块在步骤 3 引入时必须 asarUnpack（ADR-001 E-04）。
win:
  target:
    - dir
  # Demo 不签名、不发布；跳过 rcedit/签名工具链（避免拉取 winCodeSign——
  # 其解压包含 darwin symlink，在无符号链接权限的 Windows 上会失败）。
  signAndEditExecutable: false
